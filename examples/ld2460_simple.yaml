substitutions:
  name: "ld2460-sensor"
  led_pin: "2"
  uart_tx_pin: "17"
  uart_rx_pin: "18"
  uart_baud_rate: "115200"

esphome:
  name: "${name}"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable fallback hotspot
  ap:
    ssid: "${name} Fallback"
    password: "12345678"

captive_portal:

# External components
external_components:
  - source:
      type: local
      path: components

# UART configuration with debugging every byte
uart:
  id: uart_bus
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: ${uart_baud_rate}
  stop_bits: 1
  debug:
    direction: BOTH
    dummy_receiver: true
    after:
      delimiter: "\n"
    sequence:
      - lambda: UARTDebug::log_hex(direction, bytes, ':');

# LD2460 radar sensor
ld2460:
  uart_id: uart_bus
  id: ld2460_sensor

# Optional: LED indicator
output:
  - platform: gpio
    pin: ${led_pin}
    id: led_output

light:
  - platform: binary
    name: "Status LED"
    output: led_output

# Basic sensor configuration
sensor:
  - platform: ld2460
    ld2460_id: ld2460_sensor
    target_number:
      name: "Target Count"
    target_1:
      x:
        name: "Target 1 X"
      y:
        name: "Target 1 Y"

# Binary sensor for presence detection
binary_sensor:
  - platform: ld2460
    ld2460_id: ld2460_sensor
    target:
      name: "Presence Detected"

# Text sensor for version info
text_sensor:
  - platform: ld2460
    ld2460_id: ld2460_sensor
    version:
      name: "LD2460 Version"
